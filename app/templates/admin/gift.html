{% extends "admin/_layout.html" %}
{% block title %}积分赠送 · 管理后台{% endblock %}
{% block admin_body %}
<section class="card form-card form-wide">
  <h2>🎁 积分赠送 / 调整</h2>
  {% if msg %}<p class="alert ok">{{ msg }}</p>{% endif %}
  {% if err %}<p class="alert error">{{ err }}</p>{% endif %}
  <form method="post" action="{{ base_path }}/admin/gift">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>目标用户（邮箱 或 用户 ID）
      <input type="text" name="target" required placeholder="alice@example.com 或 42">
    </label>
    <label>积分变动（正数 = 赠送，负数 = 扣减）
      <input type="number" name="delta" required placeholder="例: 100 或 -20">
    </label>
    <label>备注（可选，进 ledger.note，便于审计）
      <input type="text" name="note" maxlength="200" placeholder="例: 双十一活动 / 违规扣分">
    </label>
    <button type="submit" class="btn primary block">执行调整</button>
  </form>
  <p class="muted small">
    本操作会写入 <code>point_transactions</code>（reason=admin_gift），用户可在「最近积分流水」看到。
  </p>
</section>
{% endblock %}
