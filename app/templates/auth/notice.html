{% extends "base.html" %}
{% block title %}{{ title }} · {{ site_title }}{% endblock %}
{% block content %}
<section class="card form-card">
  <h2>{{ title }}</h2>
  <p>{{ message }}</p>
  {% if action_url %}
    <p style="margin-top:16px;">
      <a href="{{ base_path }}{{ action_url }}" class="btn primary block">{{ action_label or '继续' }}</a>
    </p>
  {% else %}
    <p style="margin-top:16px;">
      <a href="{{ base_path }}/" class="muted">返回首页</a>
    </p>
  {% endif %}
</section>
{% endblock %}
