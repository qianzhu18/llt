{% extends "base.html" %}
{% block title %}登录 · {{ site_title }}{% endblock %}
{% block content %}
<section class="card form-card">
  <h2>登录</h2>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ base_path }}/auth/login">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    {% if next_param %}<input type="hidden" name="next" value="{{ next_param }}">{% endif %}
    <label>邮箱
      <input type="email" name="email" required value="{{ form_email or '' }}" autocomplete="email">
    </label>
    <label>密码
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn primary block">登录</button>
  </form>
  <p class="muted small">还没账号？<a href="{{ base_path }}/auth/register">立即注册</a></p>
  <details class="minor-details">
    <summary class="muted small">没收到验证邮件？</summary>
    <form method="post" action="{{ base_path }}/auth/resend-verify" style="margin-top:10px;">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label>注册邮箱
        <input type="email" name="email" required value="{{ form_email or '' }}" autocomplete="email">
      </label>
      <button type="submit" class="btn secondary block">重新发送验证邮件</button>
    </form>
  </details>
</section>
{% endblock %}
