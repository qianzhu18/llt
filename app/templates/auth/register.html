{% extends "base.html" %}
{% block title %}注册 · {{ site_title }}{% endblock %}
{% block content %}
<section class="card form-card">
  <h2>注册账号</h2>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ base_path }}/auth/register">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>邮箱
      <input type="email" name="email" required value="{{ form_email or '' }}" autocomplete="email">
    </label>
    <label>昵称
      <input type="text" name="nickname" required maxlength="64" value="{{ form_nickname or '' }}">
    </label>
    <label>密码（≥8 位）
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit" class="btn primary block">注册</button>
  </form>
  <p class="muted small">已有账号？<a href="{{ base_path }}/auth/login">直接登录</a></p>
</section>
{% endblock %}
