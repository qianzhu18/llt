<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<link rel="stylesheet" href="{{ base_path }}/static/app.css">
<script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
<script src="https://unpkg.com/alpinejs@3.14.7/dist/cdn.min.js" defer></script>
</head>
<body>
<nav class="navbar">
  <a href="{{ base_path }}/" class="brand">📚 {{ site_title }}</a>
  <div class="nav-links">
    <a href="{{ base_path }}/">首页</a>
    <a href="{{ base_path }}/requests">大厅</a>
    {% if current_user %}
      <a href="{{ base_path }}/me">{{ current_user.nickname or current_user.email }}{% if current_user.is_admin %} ★{% endif %}</a>
      <form method="post" action="{{ base_path }}/auth/logout" class="inline-form">
        <button type="submit" class="link-btn">登出</button>
      </form>
    {% else %}
      <a href="{{ base_path }}/auth/login">登录</a>
      <a href="{{ base_path }}/auth/register" class="nav-cta">注册</a>
    {% endif %}
  </div>
</nav>

<main class="container">
{% block content %}{% endblock %}
</main>

<footer>
  <p>互助文件仅供个人学习研究，禁止盈利或传播</p>
  <p class="muted">© {{ site_title }} · 公益项目</p>
</footer>
</body>
</html>
