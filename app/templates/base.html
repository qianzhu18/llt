<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<link rel="stylesheet" href="{{ base_path }}/static/app.css">
<script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
<script src="https://unpkg.com/alpinejs@3.14.7/dist/cdn.min.js" defer></script>
</head>
<body>
<nav class="navbar">
  <a href="{{ base_path }}/" class="brand">📚 {{ site_title }}</a>
  <div class="nav-links">
    <a href="{{ base_path }}/">首页</a>

<main class="container">

</main>

<footer>
  <p>互助文件仅供个人学习研究，禁止盈利或传播</p>
  <p class="muted">© {{ site_title }} · 公益项目</p>

</html>
