{% extends "base.html" %}
{% block title %}修改资料 · {{ site_title }}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto space-y-6">
  <div>
    <h1 class="font-headline-lg text-headline-lg text-on-surface">修改昵称</h1>
    <p class="font-body-md text-body-md text-on-surface-variant mt-1">邮箱作为登录身份保留不变，这里只更新你的公开显示名称。</p>
  </div>

  {% if error %}
    <div class="bg-error/10 border border-error/20 text-error px-4 py-3 rounded-xl font-label-md text-label-md flex items-center gap-2">
      <span class="material-symbols-outlined">error</span> {{ error }}
    </div>
  {% endif %}
  {% if message %}
    <div class="bg-[#D1FAE5]/50 border border-[#065F46]/20 text-[#065F46] px-4 py-3 rounded-xl font-label-md text-label-md flex items-center gap-2">
      <span class="material-symbols-outlined">check_circle</span> {{ message }}
    </div>
  {% endif %}

  <div class="bg-surface-container-lowest rounded-xl p-6 md:p-8 shadow-sm border border-surface-container-highest">
    <form method="post" action="{{ base_path }}/me/profile" class="space-y-5">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label class="block">
        <span class="font-label-md text-label-md text-on-surface-variant mb-1 block">邮箱（不可改）</span>
        <input type="email" value="{{ current_user.email }}" disabled
          class="w-full min-h-[48px] px-4 py-3 rounded-xl border border-outline-variant bg-surface-container text-on-surface-variant font-body-md text-body-md opacity-60">
      </label>
      <label class="block">
        <span class="font-label-md text-label-md text-on-surface-variant mb-1 block">昵称</span>
        <input type="text" name="nickname" required maxlength="64" value="{{ current_user.nickname or '' }}"
          class="w-full min-h-[48px] px-4 py-3 rounded-xl border border-outline-variant bg-surface-container-low text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all">
      </label>
      <button type="submit" class="w-full bg-primary text-on-primary py-3 rounded-xl font-label-md text-label-md hover:bg-primary-container transition-all active:scale-[0.98] shadow-sm">
        保存修改
      </button>
    </form>
  </div>
  <p class="text-center">
    <a href="{{ base_path }}/me" class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors flex items-center gap-1 justify-center">
      <span class="material-symbols-outlined text-lg">arrow_back</span> 返回个人中心
    </a>
  </p>
</div>
{% endblock %}
