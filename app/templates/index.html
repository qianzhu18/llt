{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>{{ site_title }}</h1>
  <p class="slogan">{{ site_slogan }}</p>
  <div class="cta">
    {% if current_user %}
      <a href="{{ base_path }}/requests/new" class="btn primary">📝 发布求助</a>
      <a href="{{ base_path }}/requests" class="btn secondary">📥 待应助大厅</a>
    {% else %}
      <a href="{{ base_path }}/auth/register" class="btn primary">📝 注册参与</a>
      <a href="{{ base_path }}/requests" class="btn secondary">📥 浏览大厅</a>
    {% endif %}
  </div>
  {% if not current_user %}
    <p class="muted small" style="margin-top:14px;">
      已注册？<a href="{{ base_path }}/auth/login">登录</a>
    </p>
  {% endif %}
</section>

<section class="card">
  <h2>实时动态</h2>
  <p class="muted">（M2 接入真实数据）</p>
</section>

<section class="card small muted">
  <p><strong>玩法</strong>：注册即送积分入门 → 发布求助消耗悬赏积分 → 应助他人获得积分 → 完结的文献沉淀进共享库供大家免费下载。</p>
</section>
{% endblock %}
